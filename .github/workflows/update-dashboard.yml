name: Opdater arbejdsstyrke-dashboard
run-name: "Arbejdsstyrke - ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "scripts/**"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    - cron: "17 7-10 * * 2"

permissions:
  contents: write

concurrency:
  group: update-arbejdsstyrke
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent og valider data
        id: update
        shell: bash
        run: |
          mkdir -p status data
          set +e
          python -m py_compile scripts/jobindsats_api.py scripts/fetch_sources.py scripts/validate.py > status/run.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python scripts/fetch_sources.py >> status/run.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python scripts/validate.py >> status/run.log 2>&1
            code=$?
          fi
          set -e
          cat status/run.log || true
          today="$(TZ=Europe/Copenhagen date +'%F')"
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$code" -eq 0 ]; then
            printf 'status: ok\ntid_utc: %s\ndato_dk: %s\n' "$started" "$today" > status/last-run.txt
          else
            printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\n' "$started" "$today" > status/last-run.txt
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Kontroller publiceringsfiler
        if: steps.update.outputs.exit_code == '0'
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          test -s data/dashboard-data.json
          grep -q 'Arbejdsstyrken i Danmark' index.html
          grep -q 'RAS200' data/dashboard-data.json
          grep -q 'seniorer' data/dashboard-data.json
      - name: Gem data og status
        if: always()
        run: |
          git add data/dashboard-data.json status/last-run.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Dashboard automation"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git commit -m "Opdater arbejdsstyrkedata og status"
          git push
      - name: Markér fejl
        if: steps.update.outputs.exit_code != '0'
        run: exit 1
